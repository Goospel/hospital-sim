# PR 게이트 — 머지 **전에** 테스트·타입·lint 를 돌린다.
#
# 왜 필요한가:
#   이 워크플로가 생기기 전, 이 레포에서 `npm test` 가 도는 곳은 deploy-pages.yml 하나뿐이었고
#   그건 `on: push: branches: [main]` 이다 — 즉 **머지된 다음에야** 돌았다. 깨진 테스트는 PR 을
#   그대로 통과했고, 발견되는 시점은 "심사 링크 배포가 실패했을 때"였다. 늦다.
#
#   로컬 pre-commit(.githooks/pre-commit)은 이 구멍을 메우지 못한다 — 문서 태그와
#   troubleshooting 목차만 검사하지 테스트·빌드는 안 돌고, 기기마다 `core.hooksPath` 설치가
#   필요하고, `--no-verify` 로 우회되고, powershell.exe 가 없으면 스스로 스킵한다.
#   그래서 머지 전 실질 게이트는 "돌렸다고 말하는 것"뿐이었다 — 소프트 규칙.
#
#   문서 태그 하나가 빠지면 커밋이 거부되는데 테스트가 깨진 코드는 통과하는 비대칭이었다.
#   CLAUDE.md 가 세 번 적은 그 교훈("검사기 없는 규약은 죽는 게 아니라 썩는다")을 코드 쪽에도
#   같은 세기로 건다.
name: CI

on:
  pull_request:
    branches: [main]

# PR 은 배포와 달리 중간에 죽어도 된다 — 같은 브랜치에 새 커밋이 오면 이전 런은 접는다.
# (deploy-pages.yml 이 cancel-in-progress: false 인 것과 반대인 이유: 저긴 심사 링크가 걸려 있다.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 빠른 것부터 — 첫 실패에서 멈추므로 순서가 곧 피드백 속도다.
      - run: npm run lint

      - run: npm test

      # 빌드는 **타입 검사**를 위해 돈다 — vitest 는 transpile-only 라 타입 에러를 못 잡는다.
      # 여기서 안 잡으면 머지 후 deploy-pages 가 실패하는 걸로 발견된다.
      - run: npm run build
